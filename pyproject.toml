[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hub"
version = "0.3.0"
description = "A lightweight personal command center for Linux"
readme = "README.md"
authors = [
    {name = "Hub Contributors"}
]
license = "MIT"
requires-python = ">=3.10"

dependencies = [
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "jinja2>=3.1.0",
    "rich>=13.0.0",
    "python-multipart>=0.0.6",
    "PySide6>=6.8.0"
]

[project.scripts]
hub = "hub.cli:app"
hub-desktop = "hub.desktop:main"
biohub = "hub.desktop:main"

[tool.setuptools.packages.find]
include = ["hub*"]
exclude = ["packaging*"]
